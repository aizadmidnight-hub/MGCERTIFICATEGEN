<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sijil Larian</title>
  <!-- Enjin PDF dimuatkan terus dari GitHub anda sendiri (100% stabil) -->
  <script src="jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      box-sizing: border-box;
    }
    .logo-luar {
      max-width: 180px;
      max-height: 110px;
      object-fit: contain;
      margin-bottom: 18px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 8px; color: #1a1a1a; font-size: 22px; }
    p.sub { margin: 0 0 20px; color: #555; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      text-transform: uppercase;
    }
    input:focus { border-color: #007bff; outline: none; }
    button.btn-utama {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-utama:hover { background: #0056b3; }
    #previewBox { display: none; margin-top: 20px; }
    img#hasilSijil { width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 12px; }
    .btn-pdf {
      display: block;
      width: 100%;
      padding: 14px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-simpan {
      display: block;
      width: 100%;
      padding: 13px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      box-sizing: border-box;
    }
    .nota { font-size: 12px; color: #666; margin-top: 12px; }
  </style>
</head>
<body>

  <img src="logo.png" alt="Logo Penganjur" class="logo-luar" onerror="this.style.display='none'">

  <div class="card">
    <h2>Muat Turun E-Sijil</h2>
    <p class="sub">Sila masukkan maklumat anda untuk menjana sijil penyertaan.</p>
    
    <input type="text" id="nama" placeholder="NAMA PENUH (HURUF BESAR)" required>
    <input type="text" id="ic" placeholder="NO. KAD PENGENALAN (CTH: 950101081234)" required>
    
    <button class="btn-utama" onclick="janaSijil()">Jana E-Sijil</button>

    <div id="previewBox">
      <p style="font-size: 14px; color: #28a745; font-weight: bold;">Sijil anda telah siap!</p>
      <img id="hasilSijil" alt="Pratonton Sijil">
      
      <button class="btn-pdf" onclick="muatTurunPDF()">Muat Turun PDF (Rasmi)</button>
      <a id="linkDownload" class="btn-simpan" download="ESijil.jpg">Simpan Gambar (JPG)</a>
      
      <p class="nota">Jika guna telefon, PDF akan disimpan ke dalam folder <b>Downloads / Files</b> anda.</p>
    </div>
  </div>

<canvas id="kanvas" style="display:none;"></canvas>

<script>
  let sijilDataURL = "";
  let namaPeserta = "";
  let lebarGambar = 0;
  let tinggiGambar = 0;

  function janaSijil() {
    const nama = document.getElementById('nama').value.trim().toUpperCase();
    const ic = document.getElementById('ic').value.trim();

    if (!nama || !ic) {
      alert("Sila masukkan Nama Penuh dan No. IC anda.");
      return;
    }

    const img = new Image();
    img.src = 'sijil.jpg';

    img.onload = function() {
      const canvas = document.getElementById('kanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = img.width;
      canvas.height = img.height;
      lebarGambar = img.width;
      tinggiGambar = img.height;

      ctx.drawImage(img, 0, 0);

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";

      const saizNama = Math.round(canvas.width * 0.035);
      ctx.font = "bold " + saizNama + "px Arial";
      ctx.fillText(nama, canvas.width * 0.5, canvas.height * 0.50);

      const saizIC = Math.round(canvas.width * 0.022);
      ctx.font = "normal " + saizIC + "px Arial";
      ctx.fillText(ic, canvas.width * 0.5, canvas.height * 0.52);

      sijilDataURL = canvas.toDataURL('image/jpeg', 0.95);
      namaPeserta = nama.replace(/\s+/g, '_');

      document.getElementById('hasilSijil').src = sijilDataURL;
      const link = document.getElementById('linkDownload');
      link.href = sijilDataURL;
      link.download = "ESijil_" + namaPeserta + ".jpg";
      
      document.getElementById('previewBox').style.display = 'block';
    };

    img.onerror = function() {
      alert("Ralat: Fail gambar 'sijil.jpg' tidak dijumpai dalam GitHub!");
    };
  }

  function muatTurunPDF() {
    if (!window.jspdf) {
      alert("Fail jspdf.umd.min.js belum dimuat naik ke GitHub. Sila guna butang Simpan Gambar (JPG).");
      return;
    }
    const { jsPDF } = window.jspdf;
    // Automatik kesan orientasi sijil (Melintang atau Menegak)
    const orientasi = lebarGambar > tinggiGambar ? 'l' : 'p';
    const doc = new jsPDF(orientasi, 'mm', 'a4');
    const lebarPDF = orientasi === 'l' ? 297 : 210;
    const tinggiPDF = orientasi === 'l' ? 210 : 297;

    doc.addImage(sijilDataURL, 'JPEG', 0, 0, lebarPDF, tinggiPDF);
    doc.save("ESijil_" + namaPeserta + ".pdf");
  }
</script>

</body>
</html>
